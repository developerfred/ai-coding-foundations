name: Deploy Landing Page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Copy downloads to artifact dir
        run: |
          mkdir -p _artifact/downloads
          cp -r landing/* _artifact/
          cp -r downloads/* _artifact/downloads/

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_artifact/'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
